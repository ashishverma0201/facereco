<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>User Panel</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
        body {
            background-color: #f8f9fa;
            padding: 40px;
            font-family: 'Segoe UI', sans-serif;
        }
        .profile-container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .profile-image {
            max-width: 150px;
            max-height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
  <div class="profile-container text-center">
    <h2 class="mb-4">User Profile</h2>
    
    {% if profile and profile.face_image %}
      <img src="{{ profile.face_image.url }}" alt="Face Image" class="profile-image" />
    {% else %}
      <img src="https://via.placeholder.com/150?text=No+Image" class="profile-image" />
    {% endif %}
    
    <table class="table table-striped mt-3">
      <tbody>
        <tr>
          <th scope="row">Username (Roll No.)</th>
          <td>{{ user.username }}</td>
        </tr>
        <tr>
          <th scope="row">Student Name</th>
          <td>{{ profile.student_name }}</td>
        </tr>
        <tr>
          <th scope="row">Semester</th>
          <td>{{ profile.semester }}</td>
        </tr>
        <tr>
          <th scope="row">Branch</th>
          <td>{{ profile.branch }}</td>
        </tr>
        <tr>
          <th scope="row">Email</th>
          <td>{{ user.email|default:"Not provided" }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
