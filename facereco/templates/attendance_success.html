<!DOCTYPE html>
<html>
<head>
    <title>Attendance Success</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container mt-5">
    <h2 class="text-success">Attendance Marked Successfully!</h2>
    <p><strong>Student:</strong> {{ student.username }}</p>
    <p><strong>Subject:</strong> {{ subject.name }}</p>
    <hr>
    <h4>Attendance History for {{ subject.name }}</h4>
    <table class="table table-bordered mt-3">
        <thead>
            <tr>
                <th>Date & Time</th>
                <th>Image</th>
            </tr>
        </thead>
        <tbody>
            {% for record in records %}
                <tr>
                    <td>{{ record.timestamp }}</td>
                    <td><img src="{{ record.face_image.url }}" width="100"/></td>
                </tr>
            {% empty %}
                <tr><td colspan="2">No previous attendance found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
