<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="/static/css/portal-theme.css">
</head>
<body class="bg-light">
<div class="container py-4">
  <h2 class="mb-4 text-center">Edit Student</h2>

  <form method="POST">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Student Name</label>
      <input type="text" name="student_name" class="form-control" value="{{ student.student_name }}" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Roll No</label>
      <input type="text" name="roll_no" class="form-control" value="{{ student.roll_no }}" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Semester</label>
      <input type="text" name="semester" class="form-control" value="{{ student.semester }}" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Branch</label>
      <input type="text" name="branch" class="form-control" value="{{ student.branch }}" required />
    </div>
    <button type="submit" class="btn btn-success w-100">Update</button>
  </form>
</div>
</body>
</html>
