<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a New Password</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{min-height:100vh;display:grid;place-items:center;background:#f1f5f9;font-family:Segoe UI,Arial,sans-serif}.card{width:min(92vw,540px);border:0;border-radius:22px;padding:32px;box-shadow:0 20px 55px #0f172a14}.form-control,.btn{border-radius:11px;padding:11px}</style><link rel="stylesheet" href="/static/css/portal-theme.css">
</head>
<body><main class="card"><h1 class="h3 fw-bold">Choose a new password</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<button class="btn btn-primary w-100" type="submit">Save new password</button></form>{% else %}<p>This reset link is invalid or expired. Request another link to continue.</p><a href="{% url 'parent_password_reset' %}">Request a new link</a>{% endif %}</main><script>document.querySelectorAll("input").forEach(function(input){input.classList.add("form-control");});</script></body></html>
