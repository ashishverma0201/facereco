<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parent Login | School Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top left,#dbeafe,transparent 38%),linear-gradient(145deg,#eef2ff,#f8fafc);font-family:Inter,"Segoe UI",sans-serif;color:#172554}
        .login-card{width:min(100%,460px);background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:38px;box-shadow:0 24px 70px #1e3a8a1a}
        .brand{display:inline-flex;padding:10px 14px;border-radius:14px;background:#eff6ff;color:#1d4ed8;font-weight:800;letter-spacing:.04em}
        .login-card h1{font-weight:800;letter-spacing:-.04em;margin-top:24px}
        .form-control{padding:12px 14px;border-radius:12px}
        .btn-primary{border:0;border-radius:12px;padding:13px;background:linear-gradient(120deg,#2563eb,#4f46e5);font-weight:700}
        a{color:#1d4ed8}
    </style>
<link rel="stylesheet" href="/static/css/portal-theme.css">
</head>
<body>
<main class="login-card">
    <div class="brand">SCHOOL PORTAL</div>
    <h1>Parent Login</h1>
    <p class="text-secondary">Sign in to view your child's school updates.</p>
    {% if messages %}{% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}{% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" type="email" id="email" name="email" autocomplete="email" required></div>
        <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required></div>
        <div class="d-flex justify-content-end mb-3"><a href="{% url 'parent_password_reset' %}">Forgot password?</a></div>
        <button class="btn btn-primary w-100" type="submit">Log in</button>
    </form>
    <p class="text-center mt-4 mb-0">Need an account? <a href="{% url 'parent_register' %}">Create Parent Account</a></p>
    <p class="text-center mt-3 mb-0 small"><a href="{% url 'login' %}">Student / Teacher login</a></p>
</main>
</body>
</html>
