<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Parent Account | School Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{min-height:100vh;padding:32px 16px;background:linear-gradient(140deg,#eff6ff,#f5f3ff);font-family:Inter,"Segoe UI",sans-serif;color:#172554}
        .register-card{max-width:760px;margin:auto;background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:clamp(24px,5vw,44px);box-shadow:0 24px 70px #1e3a8a1a}
        .brand{display:inline-flex;padding:9px 13px;border-radius:13px;background:#eff6ff;color:#1d4ed8;font-weight:800}
        .form-control,.form-select{padding:12px 14px;border-radius:12px}
        .btn-primary{border:0;border-radius:12px;padding:13px;background:linear-gradient(120deg,#2563eb,#4f46e5);font-weight:700}
    </style>
<link rel="stylesheet" href="/static/css/portal-theme.css">
</head>
<body>
<main class="register-card">
    <div class="brand">SCHOOL PORTAL</div>
    <h1 class="h2 fw-bold mt-4">Create Parent Account</h1>
    <p class="text-secondary">Ask the school admin for a one-time student verification code. A roll number alone cannot link an account.</p>
    {% if messages %}{% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}{% endif %}
    <form method="post" class="row g-3">
        {% csrf_token %}
        <div class="col-md-6"><label class="form-label" for="full-name">Full name</label><input class="form-control" id="full-name" name="full_name" maxlength="150" autocomplete="name" required></div>
        <div class="col-md-6"><label class="form-label" for="email">Email address</label><input class="form-control" type="email" id="email" name="email" autocomplete="email" required></div>
        <div class="col-md-6"><label class="form-label" for="roll-no">Student ID / Roll number</label><input class="form-control" id="roll-no" name="roll_no" maxlength="20" required></div>
        <div class="col-md-6"><label class="form-label" for="relationship">Relationship</label><select class="form-select" id="relationship" name="relationship" required><option value="">Choose relationship</option><option value="FATHER">Father</option><option value="MOTHER">Mother</option><option value="GUARDIAN">Guardian</option></select></div>
        <div class="col-12"><label class="form-label" for="verification-code">School-issued verification code</label><input class="form-control" id="verification-code" name="verification_code" autocomplete="one-time-code" required></div>
        <div class="col-md-6"><label class="form-label" for="password">Password</label><input class="form-control" type="password" id="password" name="password" autocomplete="new-password" required></div>
        <div class="col-md-6"><label class="form-label" for="confirm-password">Confirm password</label><input class="form-control" type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" required></div>
        <div class="col-12"><button class="btn btn-primary w-100" type="submit">Verify and create account</button></div>
    </form>
    <p class="text-center mt-4 mb-0">Already registered? <a href="{% url 'parent_login' %}">Parent Login</a></p>
</main>
</body>
</html>
