<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Parent Password</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{min-height:100vh;display:grid;place-items:center;background:#f1f5f9;font-family:Segoe UI,Arial,sans-serif}.card{width:min(92vw,500px);border:0;border-radius:22px;padding:32px;box-shadow:0 20px 55px #0f172a14}.form-control,.btn{border-radius:11px;padding:12px}</style><link rel="stylesheet" href="/static/css/portal-theme.css">
</head>
<body><main class="card"><h1 class="h3 fw-bold">Forgot password?</h1><p class="text-secondary">Enter your parent account email and we will send password reset instructions.</p>{% if form.errors %}<div class="alert alert-danger">{{ form.email.errors }}</div>{% endif %}<form method="post">{% csrf_token %}<label class="form-label" for="id_email">Email address</label>{{ form.email }}<button class="btn btn-primary w-100 mt-3" type="submit">Send reset instructions</button></form><a class="mt-3" href="{% url 'parent_login' %}">Back to Parent Login</a></main><script>document.getElementById("id_email").classList.add("form-control");</script></body></html>
