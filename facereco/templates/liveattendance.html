<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Attendance</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<style>
/* Body and Background */
body {
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 15px;
}

/* Card Styling */
.card {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    width: 100%;
    max-width: 600px;
    animation: fadeInUp 1s ease;
    color: #fff;
}

/* Headings */
h2 {
    font-weight: 700;
    font-size: 2rem;
    text-align: center;
    margin-bottom: 30px;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
}

/* Alerts */
.alert {
    border-radius: 15px;
    font-weight: 500;
}

/* Form Labels */
label {
    font-weight: 600;
    margin-bottom: 5px;
}

/* Select and Input Styling */
.form-select, .btn {
    border-radius: 12px;
    transition: all 0.3s ease;
}

.form-select:focus, .btn:focus {
    box-shadow: 0 0 10px rgba(255,255,255,0.7);
    outline: none;
}

/* Buttons */
.btn-success {
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    border: none;
    font-weight: 600;
    font-size: 1.1rem;
    padding: 10px 0;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

.btn-success:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.3);
}

/* Webcam & Canvas */
video, canvas {
    width: 100%;
    border-radius: 15px;
    margin-top: 10px;
    border: 2px solid rgba(255,255,255,0.5);
}

/* Capture Button */
.btn-secondary {
    background: linear-gradient(135deg, #ff6a00, #ee0979);
    border: none;
    color: #fff;
    font-weight: 600;
    transition: all 0.3s ease;
}

.btn-secondary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

/* Animations */
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px);}
    to { opacity: 1; transform: translateY(0);}
}

/* Responsive */
@media(max-width: 576px){
    .card { padding: 20px; }
    h2 { font-size: 1.7rem; }
}
</style>
</head>
<body>

<div class="card shadow">

<h2>Live Attendance</h2>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}
{% if success %}
<div class="alert alert-success">
    {{ success }}<br>
    <b>Student Name:</b> {{ student.student_name }} <br>
    <b>Roll No:</b> {{ student.roll_no }} <br>
    <b>Branch:</b> {{ student.branch }} <br>
    <b>Semester:</b> {{ student.semester }} <br>
    <b>Subject:</b> {{ subject.name }}
</div>
{% endif %}

<form method="post" onsubmit="return validateForm();">
{% csrf_token %}

<div class="mb-3">
<label>Branch</label>
<select class="form-select" id="branch" name="branch" onchange="updateSemester();" required>
    <option value="">Select Branch</option>
    {% for b in branches %}
    <option value="{{ b }}">{{ b }}</option>
    {% endfor %}
</select>
</div>

<div class="mb-3">
<label>Semester</label>
<select class="form-select" id="semester" name="semester" onchange="updateSubject();" required>
    <option value="">Select Semester</option>
</select>
</div>

<div class="mb-3">
<label>Subject</label>
<select class="form-select" id="subject" name="subject" required>
    <option value="">Select Subject</option>
</select>
</div>

<div class="mb-3">
<label>Capture Your Face</label>
<video id="webcam" autoplay></video>
<canvas id="canvas" style="display:none;"></canvas>
<input type="hidden" name="face_image_data" id="faceImageData">
<button type="button" class="btn btn-secondary mt-2 w-100" onclick="captureImage()">📸 Capture Face</button>
</div>

<button type="submit" class="btn btn-success mt-3 w-100">✅ Mark Attendance</button>
</form>
</div>

<script>
// Branch → Semester → Subject mapping
const branchSemSubjects = {{ semester_subjects|safe }};

// Populate semester dropdown
function updateSemester() {
    const branch = document.getElementById('branch').value;
    const semesterSelect = document.getElementById('semester');
    semesterSelect.innerHTML = '<option value="">Select Semester</option>';
    if(branch in branchSemSubjects){
        for(let sem in branchSemSubjects[branch]){
            semesterSelect.innerHTML += `<option value="${sem}">${sem}</option>`;
        }
    }
    updateSubject();
}

// Populate subject dropdown
function updateSubject() {
    const branch = document.getElementById('branch').value;
    const semester = document.getElementById('semester').value;
    const subjectSelect = document.getElementById('subject');
    subjectSelect.innerHTML = '<option value="">Select Subject</option>';
    if(branch && semester && branch in branchSemSubjects && semester in branchSemSubjects[branch]){
        branchSemSubjects[branch][semester].forEach(sub=>{
            subjectSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
        });
    }
}

// Webcam
const webcam = document.getElementById('webcam');
const canvas = document.getElementById('canvas');
const faceImageData = document.getElementById('faceImageData');

navigator.mediaDevices.getUserMedia({video:true})
.then(stream => webcam.srcObject = stream)
.catch(err => alert('Cannot access webcam. Please allow permission.') );

function captureImage(){
    canvas.width = webcam.videoWidth;
    canvas.height = webcam.videoHeight;
    canvas.getContext('2d').drawImage(webcam,0,0,canvas.width,canvas.height);
    faceImageData.value = canvas.toDataURL('image/png');
    alert('✅ Face captured!');
}

// Validate form
function validateForm(){
    if(!faceImageData.value){
        alert('⚠️ Please capture your face before submitting.');
        return false;
    }
    return true;
}
</script>
</body>
</html>
