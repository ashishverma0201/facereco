<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Student Registration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<style>
/* Body & Background */
body {
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 15px;
}

/* Form Container */
.form-container {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    border-radius: 25px;
    padding: 30px 25px;
    max-width: 550px;
    width: 100%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    animation: fadeInUp 1s ease;
    color: #fff;
}

/* Heading */
h2 {
    font-weight: 700;
    font-size: 2rem;
    text-align: center;
    margin-bottom: 25px;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.4);
}

/* Form Labels */
.form-label {
    font-weight: 600;
    transition: color 0.3s;
}
.form-label:hover {
    color: #ff6f61;
}

/* Inputs & Select */
.form-control, .form-select {
    border-radius: 12px;
    transition: all 0.3s ease;
    background: rgba(255,255,255,0.15);
    color: #efe9e9ff;
    border: 1px solid rgba(255,255,255,0.4);
}
.form-control:focus, .form-select:focus {
    border-color: #ff6f61;
    box-shadow: 0 0 10px rgba(255,111,97,0.4);
    background: rgba(255,255,255,0.25);
    color: #0c0c0cff;
}

/* Buttons */
.btn-primary {
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    border: none;
    font-weight: 600;
    transition: transform 0.2s, box-shadow 0.3s;
}
.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.btn-secondary {
    background: linear-gradient(135deg, #ff6f61, #ff8a65);
    border: none;
    color: #fff;
    font-weight: 600;
    transition: transform 0.2s, box-shadow 0.3s;
}
.btn-secondary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

/* Alerts */
.alert {
    border-radius: 15px;
    font-weight: 500;
}

/* Webcam & Canvas */
video, canvas {
    width: 100%;
    border-radius: 15px;
    margin-top: 10px;
    border: 2px solid rgba(255,255,255,0.4);
    transition: all 0.3s ease;
}
video:hover, canvas:hover {
    box-shadow: 0 0 15px rgba(255,111,97,0.5);
}

/* Animations */
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px);}
    to { opacity: 1; transform: translateY(0);}
}
@keyframes fieldFade {
    from { opacity: 0; transform: translateY(20px);}
    to { opacity: 1; transform: translateY(0);}
}
.mb-3 { animation: fieldFade 0.7s; animation-fill-mode: backwards; }
.mb-3:nth-child(1) { animation-delay: 0.1s; }
.mb-3:nth-child(2) { animation-delay: 0.2s; }
.mb-3:nth-child(3) { animation-delay: 0.3s; }
.mb-3:nth-child(4) { animation-delay: 0.4s; }
.mb-3:nth-child(5) { animation-delay: 0.5s; }
.mb-3:nth-child(6) { animation-delay: 0.6s; }
.mb-3:nth-child(7) { animation-delay: 0.7s; }

/* Responsive */
@media(max-width:576px){
    .form-container { padding: 20px; border-radius: 20px; }
    h2 { font-size: 1.7rem; }
}
</style>
</head>
<body>
  <div class="form-container">
    <h2>Student Registration</h2>
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    <form id="registrationForm" method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Student Name</label>
        <input type="text" class="form-control" name="student_name" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Roll Number</label>
        <input type="text" class="form-control" name="roll_no" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Semester</label>
        <select class="form-select" name="semester" required>
          <option value="">Select Semester</option>
          <option value="First">First</option>
          <option value="Second">Second</option>
          <option value="Third">Third</option>
          <option value="Fourth">Fourth</option>
          <option value="Fifth">Fifth</option>
          <option value="Sixth">Sixth</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Branch</label>
        <select class="form-select" name="branch" required>
          <option value="">Select Branch</option>
          <option value="IT">IT</option>
          <option value="CSE">CSE</option>
          <option value="ECE">ECE</option>
          <option value="EE">EE</option>
          <option value="CE">CE</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" required minlength="6"/>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="confirmPassword" name="confirm_password" required minlength="6"/>
      </div>
      <div class="mb-3">
        <label class="form-label">Capture Your Face</label>
        <video id="webcam" autoplay></video>
        <button type="button" class="btn btn-secondary mt-2 w-100" onclick="captureImage()">📸 Capture Face</button>
        <canvas id="canvas" style="display: none;"></canvas>
        <input type="hidden" name="face_image_data" id="faceImageData" />
      </div>
      <button type="submit" class="btn btn-primary w-100 mt-3">Register</button>
    </form>
  </div>

<script>
const webcam = document.getElementById('webcam');
const canvas = document.getElementById('canvas');
const faceImageData = document.getElementById('faceImageData');

navigator.mediaDevices.getUserMedia({video:true})
.then(stream => webcam.srcObject = stream)
.catch(err => alert('Failed to access webcam.'));

function captureImage() {
    canvas.width = webcam.videoWidth;
    canvas.height = webcam.videoHeight;
    canvas.getContext('2d').drawImage(webcam, 0, 0, canvas.width, canvas.height);
    faceImageData.value = canvas.toDataURL('image/png');
    alert('✅ Face captured!');
}

document.getElementById('registrationForm').addEventListener('submit', function(event){
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if(!faceImageData.value){
        alert('⚠️ Please capture your face image.');
        event.preventDefault();
        return;
    }
    if(password !== confirmPassword){
        alert('⚠️ Passwords do not match!');
        event.preventDefault();
        return;
    }
});
</script>
</body>
</html>
