<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#4facfe,#00f2fe,#43e97b);
    background-size:400% 400%;
    animation:bgAnimation 12s ease infinite;
}

@keyframes bgAnimation{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:430px;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(18px);
    border-radius:20px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h2{
    text-align:center;
    color:white;
    margin-bottom:20px;
    letter-spacing:1px;
    text-shadow:2px 2px 5px black;
}

.messages{
    color:#ffeb3b;
    text-align:center;
    margin-bottom:15px;
}

input,
select{
    width:100%;
    padding:13px;
    margin:10px 0;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,.9);
    transition:.4s;
    font-size:15px;
}

input:focus,
select:focus{
    transform:scale(1.03);
    box-shadow:0 0 15px cyan;
}

video{
    width:100%;
    border-radius:15px;
    border:3px solid white;
    margin-top:10px;
    box-shadow:0 0 15px rgba(0,0,0,.3);
}

canvas{
    display:none;
}

img{
    width:100%;
    display:none;
    margin-top:15px;
    border-radius:15px;
    border:3px solid white;
    animation:zoom .5s;
}

@keyframes zoom{
    from{
        transform:scale(.7);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:12px;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.4s;
}

.capture{
    background:linear-gradient(45deg,#2196F3,#00BCD4);
}

.capture:hover{
    transform:translateY(-3px);
    box-shadow:0 0 20px cyan;
}

.register{
    background:linear-gradient(45deg,#00c853,#64dd17);
}

.register:hover{
    transform:translateY(-3px);
    box-shadow:0 0 20px lime;
}

input::placeholder{
    color:#666;
}

@media(max-width:500px){

.container{
    width:95%;
    padding:20px;
}

}

</style>

</head>

<body>

<div class="container">

<h2>🎓 Student Registration</h2>

{% if messages %}
<div class="messages">
{% for message in messages %}
<p>{{ message }}</p>
{% endfor %}
</div>
{% endif %}

<form method="POST">

{% csrf_token %}

<input
type="text"
name="student_name"
placeholder="Student Name"
required>

<input
type="text"
name="roll_no"
placeholder="Roll Number"
required>

<select
name="semester"
required>

<option value="">Select Semester</option>

<option value="1">First</option>
<option value="2">Second</option>
<option value="3">Third</option>
<option value="4">Fourth</option>
<option value="5">Fifth</option>
<option value="6">Sixth</option>

</select>

<select
name="branch"
required>

<option value="">Select Branch</option>

<option>IT</option>
<option>CSE</option>
<option>ECE</option>
<option>EE</option>
<option>CE</option>

</select>

<input
type="password"
name="password"
placeholder="Password"
required>

<input
type="password"
name="confirm_password"
placeholder="Confirm Password"
required>

<video
id="video"
autoplay>
</video>

<button
type="button"
class="capture"
onclick="captureImage()">

📷 Capture Face

</button>

<canvas id="canvas"></canvas>

<img id="preview">

<input
type="hidden"
name="face_image_data"
id="face_image_data">

<button
type="submit"
class="register">

✅ Register

</button>

</form>

</div>

<script>

const video=document.getElementById("video");

navigator.mediaDevices.getUserMedia({
video:true
})

.then(function(stream){

video.srcObject=stream;

})

.catch(function(){

alert("Camera access denied.");

});

function captureImage(){

const canvas=document.getElementById("canvas");

canvas.width=video.videoWidth;

canvas.height=video.videoHeight;

const ctx=canvas.getContext("2d");

ctx.drawImage(video,0,0);

const image=canvas.toDataURL("image/jpeg");

document.getElementById("face_image_data").value=image;

const preview=document.getElementById("preview");

preview.src=image;

preview.style.display="block";

alert("Face Captured Successfully");

}

document.querySelector("form").addEventListener("submit",function(e){

const password=document.querySelector("[name=password]").value;

const confirm=document.querySelector("[name=confirm_password]").value;

const face=document.getElementById("face_image_data").value;

if(password!==confirm){

e.preventDefault();

alert("Passwords do not match.");

return;

}

if(face==""){

e.preventDefault();

alert("Please capture your face.");

return;

}

});

</script>

</body>
</html>
